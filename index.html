<style>
/* Layout: classified terminal. Header with live log, tab bar, then a list + dossier split (single column on phones). Single red-on-black look by design. */
:root {
  --bg: #080304;
  --bg2: #110506;
  --panel: #150708;
  --line: #4a1218;
  --line-hi: #9a1f28;
  --red: #ff3b3b;
  --ink: #ff7b73;
  --ink-dim: #d06a66;
  --warn: #ffb347;
  --font-display: "Oxanium", "Eurostile", "Bahnschrift", system-ui, sans-serif;
  --font-mono: "Share Tech Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { background: var(--bg); }
body {
  margin: 0; color: var(--ink); font: 15px/1.55 var(--font-mono);
  background: radial-gradient(120% 80% at 50% 0%, var(--bg2), var(--bg) 70%);
  min-height: 100%;
}
.scan { position: fixed; inset: 0; pointer-events: none; z-index: 60;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.22) 2px 3px); }
.shell { max-width: 1180px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 40px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .06em; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--red); outline-offset: 2px; }

.top { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 8px 24px;
  padding-bottom: 12px; border-bottom: 1px solid var(--line-hi); }
.brand { display: flex; flex-direction: column; min-width: 0; }
.mk { font: 700 clamp(28px, 7vw, 44px)/1 var(--font-display); letter-spacing: .28em; color: var(--red);
  text-shadow: 0 0 10px rgba(255,59,59,.55); }
.sub { font-size: 12px; letter-spacing: .18em; color: var(--ink-dim); margin-top: 6px; }
.log { font-size: 12px; letter-spacing: .08em; color: var(--ink-dim); min-width: 0; }
.log b { color: var(--red); font-weight: 400; }
.cur::after { content: "\2588"; margin-left: 4px; color: var(--red); animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }

.tabs { display: flex; gap: 6px; overflow-x: auto; padding-block: 12px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: none; background: none; border: 1px solid var(--line); padding: 8px 14px; letter-spacing: .14em; font-size: 13px; color: var(--ink-dim); }
.tab[aria-selected="true"] { background: var(--red); color: var(--bg); border-color: var(--red); font-weight: 700; }

.bar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 14px; }
.q { flex: 1 1 220px; min-width: 0; background: var(--panel); border: 1px solid var(--line-hi); padding: 10px 12px; letter-spacing: .06em; }
.q::placeholder { color: var(--ink-dim); opacity: .8; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: none; border: 1px solid var(--line); padding: 4px 10px; font-size: 12px; letter-spacing: .1em; color: var(--ink-dim); }
.chip[aria-pressed="true"] { border-color: var(--red); color: var(--red); background: rgba(255,59,59,.12); }
.meta { font-size: 12px; letter-spacing: .12em; color: var(--ink-dim); display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin-bottom: 12px; }
.pill { border: 1px solid var(--warn); color: var(--warn); padding: 1px 8px; background: none; font-size: 12px; letter-spacing: .1em; }

.split { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 860px) { .split { grid-template-columns: minmax(0, 340px) minmax(0, 1fr); align-items: start; } .back { display: none; } }
@media (max-width: 859px) { .split[data-view="list"] .dossier, .split[data-view="dossier"] .list { display: none; } }

.list { display: flex; flex-direction: column; gap: 6px; }
.row { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left;
  background: var(--panel); border: 1px solid var(--line); padding: 10px 12px; }
.row .n { color: var(--ink-dim); font-size: 12px; }
.row .nm { font: 700 17px/1.2 var(--font-display); letter-spacing: .08em; color: var(--red); overflow-wrap: anywhere; }
.row .al { display: block; font-size: 12px; color: var(--ink-dim); overflow-wrap: anywhere; }
.tag { font-size: 11px; letter-spacing: .14em; border: 1px solid var(--line-hi); padding: 1px 6px; color: var(--ink-dim); white-space: nowrap; }
.row[aria-current="true"] { background: rgba(255,59,59,.14); border-color: var(--red); }

.brk { position: relative; border: 1px solid var(--line); background: var(--panel); padding: 16px;
  background-image:
    linear-gradient(var(--red), var(--red)), linear-gradient(var(--red), var(--red)),
    linear-gradient(var(--red), var(--red)), linear-gradient(var(--red), var(--red)),
    linear-gradient(var(--red), var(--red)), linear-gradient(var(--red), var(--red)),
    linear-gradient(var(--red), var(--red)), linear-gradient(var(--red), var(--red));
  background-size: 12px 2px, 2px 12px, 12px 2px, 2px 12px, 12px 2px, 2px 12px, 12px 2px, 2px 12px;
  background-position: left top, left top, right top, right top, left bottom, left bottom, right bottom, right bottom;
  background-repeat: no-repeat; }
.dossier { min-width: 0; display: flex; flex-direction: column; gap: 16px; }
.dh { display: flex; flex-direction: column; gap: 6px; }
.dh h2 { font-size: clamp(26px, 6vw, 40px); line-height: 1.05; color: var(--red); text-shadow: 0 0 10px rgba(255,59,59,.45); overflow-wrap: anywhere; }
.dh p { margin: 0; color: var(--ink-dim); overflow-wrap: anywhere; }
.back { align-self: flex-start; background: none; border: 1px solid var(--line-hi); padding: 6px 12px; letter-spacing: .12em; font-size: 13px; }
.twocol { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 700px) { .twocol { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }

.slot { aspect-ratio: 4 / 3; max-width: 100%; position: relative; overflow: hidden; border: 1px solid var(--line-hi);
  background: repeating-linear-gradient(45deg, #12060700 0 10px, #1a090b 10px 11px), var(--bg2);
  display: grid; place-items: center; text-align: center; padding: 12px; }
.slot img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) sepia(1) hue-rotate(-50deg) saturate(3.5) brightness(.85) contrast(1.1); }
.slot.orig img { filter: none; }
.slot .ret { width: 56px; height: 56px; border: 1px solid var(--red); border-radius: 50%; margin: 0 auto 8px; position: relative; }
.slot .ret::before, .slot .ret::after { content: ""; position: absolute; background: var(--red); }
.slot .ret::before { left: 50%; top: -8px; bottom: -8px; width: 1px; }
.slot .ret::after { top: 50%; left: -8px; right: -8px; height: 1px; }
.slot small { display: block; letter-spacing: .14em; color: var(--ink-dim); font-size: 12px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.btn { background: none; border: 1px solid var(--red); color: var(--red); padding: 6px 12px; letter-spacing: .1em; font-size: 12px; text-decoration: none; display: inline-block; }
.btn.dim { border-color: var(--line-hi); color: var(--ink-dim); }
.upl { position: relative; overflow: hidden; cursor: pointer; }
.upl input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; cursor: pointer; font-size: 200px; }
.upl:focus-within { outline: 2px solid var(--red); outline-offset: 2px; }
.msg { font-size: 12px; color: var(--warn); margin-top: 6px; min-height: 1em; }

dl.spec { margin: 0; display: grid; grid-template-columns: minmax(0, auto) minmax(0, 1fr); gap: 6px 14px; }
dl.spec dt { color: var(--ink-dim); letter-spacing: .12em; font-size: 12px; padding-top: 2px; }
dl.spec dd { margin: 0; overflow-wrap: anywhere; }
.sec { font: 700 13px var(--font-display); letter-spacing: .22em; color: var(--ink-dim); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin-bottom: 10px; }
ul.l { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
ul.l li { padding-left: 18px; position: relative; overflow-wrap: anywhere; }
ul.l li::before { content: ">"; position: absolute; left: 0; color: var(--red); }
.spoil { display: inline; text-align: left; background: none; border: 0; padding: 0; filter: blur(5px); user-select: none; }
.spoil[data-open="1"] { filter: none; user-select: auto; }
.sp { color: var(--warn); font-size: 11px; letter-spacing: .12em; margin-right: 6px; }

.whos { display: flex; flex-wrap: wrap; gap: 6px; }
.card .tag { white-space: normal; }
.cards { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.card { border: 1px solid var(--line); background: var(--panel); padding: 14px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.card h3 { font-size: 18px; color: var(--red); overflow-wrap: anywhere; }
.card p { margin: 0; overflow-wrap: anywhere; }
.card .k { color: var(--ink-dim); font-size: 12px; letter-spacing: .1em; }
.tl { list-style: none; margin: 0; padding: 0 0 0 18px; border-left: 1px solid var(--line-hi); display: flex; flex-direction: column; gap: 18px; }
.tl li { position: relative; }
.tl li::before { content: ""; position: absolute; left: -23px; top: 7px; width: 9px; height: 9px; background: var(--red); }
.tl .y { font: 700 20px var(--font-display); color: var(--red); letter-spacing: .1em; }
.foot { margin-top: 28px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 12px; color: var(--ink-dim); letter-spacing: .06em; }

@media (prefers-reduced-motion: reduce) { .cur::after { animation: none; } }
</style>

    people: function () {
      return cards(PEOPLE, function (p) {
        var where = p.in.split(", ").map(label).join(" / ");
        return '<article class="card"><span class="k">' + esc(p.by.toUpperCase()) + "</span><h3>" + esc(p.name) + "</h3><p>" + esc(p.note) + '</p><span class="k">IN: ' + esc(where.toUpperCase()) + "</span></article>";
      });
    },
    glossary: function () {
      return cards(GLOSSARY, function (g) { return '<article class="card"><h3>' + esc(g.k) + "</h3><p>" + esc(g.v) + "</p></article>"; });
    }
  };

  function renderTabs() {
    $("#tabs").innerHTML = TABS.map(function (t) { return '<button class="tab" role="tab" type="button" data-tab="' + t[0] + '" aria-selected="' + (state.tab === t[0]) + '">' + t[1] + "</button>"; }).join("");
  }
  function show() {
    renderTabs();
    var t = state.tab, m = $("#main");
    if (SETS[t]) { m.innerHTML = recordsShell(); updateRecords(); }
    else if (t === "archive") { m.innerHTML = archiveShell(); updateArchive(); }
    else if (t === "rivals") { m.innerHTML = rivalsShell(); updateRivals(); }
    else m.innerHTML = VIEWS[t]();
  }
  function go(tab) { state.tab = tab; state.kind = "ALL"; state.q = ""; state.src = null; state.view = "list"; }
  function toTop() { if (window.innerWidth < 860) window.scrollTo(0, 0); }

  /* ---------- Images ---------- */
  function processFile(file, id) {
    if (!file) return;
    var msg = $("#msg");
    if (!/^image\//.test(file.type)) { msg.textContent = "THAT FILE IS NOT AN IMAGE."; return; }
    var fr = new FileReader();
    fr.onload = function () {
      var im = new Image();
      im.onload = function () {
        var s = Math.min(1, 720 / Math.max(im.width, im.height));
        var c = document.createElement("canvas");
        c.width = Math.max(1, Math.round(im.width * s)); c.height = Math.max(1, Math.round(im.height * s));
        c.getContext("2d").drawImage(im, 0, 0, c.width, c.height);
        var url;
        try { url = c.toDataURL("image/jpeg", 0.82); } catch (e) { msg.textContent = "COULD NOT READ THAT IMAGE."; return; }
        imgs[id] = url;
        var ok = lsSet("mv_img_" + id, url);
        updateRecords();
        if (!ok) $("#msg").textContent = "SHOWN FOR THIS SESSION ONLY. BROWSER STORAGE IS FULL OR BLOCKED.";
      };
      im.onerror = function () {
        if (file.size < 1500000 && /^data:image\//.test(String(fr.result))) {
          imgs[id] = fr.result;
          var ok2 = lsSet("mv_img_" + id, fr.result);
          updateRecords();
          if (!ok2) $("#msg").textContent = "SHOWN FOR THIS SESSION ONLY. BROWSER STORAGE IS FULL OR BLOCKED.";
        } else msg.textContent = "COULD NOT READ THAT IMAGE. TRY A JPG OR PNG.";
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  }

  /* ---------- Events ---------- */
  document.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (!b) return;
    var d = b.dataset;
    if (d.sp !== undefined) { b.setAttribute("data-open", "1"); return; }
    if (d.tab) { go(d.tab); show(); window.scrollTo(0, 0); return; }
    if (d.kind) { state.kind = d.kind; state.view = "list"; updateRecords(); return; }
    if (d.au) { state.au = d.au; updateArchive(); return; }
    if (d.rk) { state.rk = d.rk; updateRivals(); return; }
    if (d.ru) { state.ru = d.ru; updateRivals(); return; }
    if (d.id) { state.sel[state.tab] = d.id; state.view = "dossier"; updateRecords(); toTop(); return; }
    if (d.back !== undefined) { state.view = "list"; updateRecords(); toTop(); return; }
    if (d.src) { state.src = d.src; state.view = "list"; updateRecords(); toTop(); return; }
    if (d.clear !== undefined) { state.src = null; updateRecords(); return; }
    if (d.work) { go(d.wtab || "titans"); state.src = d.work; show(); window.scrollTo(0, 0); return; }
    if (d.goto) { go("titans"); state.sel.titans = d.goto; state.view = "dossier"; show(); window.scrollTo(0, 0); return; }
    if (d.col !== undefined) { state.color = !state.color; updateRecords(); return; }
    if (d.rm !== undefined) { var id = state.sel[state.tab]; delete imgs[id]; lsDel("mv_img_" + id); updateRecords(); }
  });
  document.addEventListener("input", function (e) {
    var id = e.target.id;
    if (id === "q") { state.q = e.target.value; state.view = "list"; updateRecords(); }
    else if (id === "aq") { state.aq = e.target.value; updateArchive(); }
    else if (id === "rq") { state.rq = e.target.value; updateRivals(); }
  });
  document.addEventListener("change", function (e) {
    if (e.target.id === "file") processFile(e.target.files[0], state.sel[state.tab]);
  });

  var LOG = ["AUTH TOKEN ACCEPTED", "OUTPOST UPLINK ONLINE", (TITANS.length + KAIJU.length) + " RECORDS LOADED", WORKS.length + " WORKS IN THE ARCHIVE", "TITAN ACTIVITY: MONITORED"];
  var li = 0;
  if (!window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
    setInterval(function () { if (document.hidden) return; li = (li + 1) % LOG.length; $("#logtxt").textContent = LOG[li]; }, 3200);
  }

  show();
})();
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) { navigator.serviceWorker.register("sw.js").catch(function () {}); }
</script>
</body>
</html>
